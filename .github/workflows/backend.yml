name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 18.x
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        
    - name: Install dependencies
      run: npm install
      
    - name: Type check parameters and run esbuild
      run: |
        npx tsc --noEmit
        npx esbuild src/handlers/**/*.ts --bundle --platform=node --target=node18 --outdir=dist/handlers --external:@aws-sdk/* --format=cjs
