name: marrty_ifr31
description: Marrty IFR31 — Smart Attendance System for Faculty & HOD
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ─────────────────────────────────────
  dio: ^5.4.0

  # ── State Management ───────────────────────────────
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # ── Navigation ─────────────────────────────────────
  go_router: ^14.0.0

  # ── Local Storage ──────────────────────────────────
  shared_preferences: ^2.2.0

  # ── Camera & ML ────────────────────────────────────
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  google_mlkit_face_detection: ^0.11.0

  # ── Charts & Data Viz ──────────────────────────────
  fl_chart: ^0.68.0
  flutter_heatmap_calendar: ^1.0.5

  # ── Sharing & External ─────────────────────────────
  share_plus: ^9.0.0
  url_launcher: ^6.2.6

  # ── Location ───────────────────────────────────────
  geolocator: ^12.0.0
  google_maps_flutter: ^2.6.1

  # ── Permissions ────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Utilities ──────────────────────────────────────
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  path_provider: ^2.1.3
  uuid: ^4.4.0

  # ── UI & Animations ────────────────────────────────
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.9
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
